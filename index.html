<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어·국어 본문 빈칸 채우기 학습기</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <style>
    :root {
      --ink: #182530;
      --paper: #f4f1e8;
      --cream: #fffcf4;
      --line: #d9d2c3;
      --teal: #0f766e;
      --coral: #df6c51;
      --muted: #66717a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
        Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue',
        sans-serif;
      background-color: var(--paper);
    }

    .app-shell {
      width: 100%;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }

    .app-shell::before,
    .app-shell::after {
      content: "";
      position: fixed;
      z-index: 0;
      width: 22rem;
      height: 22rem;
      border-radius: 999px;
      pointer-events: none;
      opacity: 0.38;
    }

    .app-shell::before {
      top: -10rem;
      right: -9rem;
      background: #b8e1d7;
    }

    .app-shell::after {
      bottom: -12rem;
      left: -10rem;
      background: #f5c8ae;
    }

    .main-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 3rem 1.25rem 4rem;
    }

    .paper-panel {
      border: 1px solid var(--line);
      border-radius: 1.25rem;
      box-shadow: 0 18px 45px rgba(24, 37, 48, 0.07);
    }

    .source-area {
      min-height: 9.5rem;
      resize: vertical;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .source-area:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.13);
    }

    .mode-button,
    .action-button {
      transition:
        transform 0.16s ease,
        filter 0.16s ease,
        box-shadow 0.16s ease;
    }

    .mode-button:hover,
    .action-button:hover {
      transform: translateY(-1px);
      filter: brightness(0.98);
    }

    .mode-button {
      border: 1px solid transparent;
      color: var(--muted);
    }

    .mode-button.is-active {
      color: #ffffff;
      background: var(--teal) !important;
      border-color: var(--teal);
      box-shadow: 0 8px 18px rgba(15, 118, 110, 0.2);
    }

    .quiz-copy {
      font-size: 1.08rem;
      line-height: 2.65;
      letter-spacing: 0.005em;
      overflow-wrap: break-word;
    }

    .blank-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin: 0 0.2rem;
      vertical-align: middle;
    }

    .blank-input {
      display: inline-block;
      width: min(9rem, 45vw);
      min-width: 4.4rem;
      height: 2.2rem;
      padding: 0.1rem 1.8rem 0.1rem 0.45rem;
      vertical-align: middle;
      border: 1px solid #9dbab2;
      border-radius: 0.42rem;
      background: #eef7f4;
      color: var(--ink);
      font: inherit;
      line-height: 1;
      text-align: center;
      outline: none;
      transition:
        border-color 0.16s ease,
        background 0.16s ease,
        color 0.16s ease,
        transform 0.16s ease;
    }

    .blank-input:focus {
      border-color: var(--teal);
      background: #ffffff;
    }

    .blank-input.is-correct {
      border-color: #16825d;
      background: #ddf5e8;
      color: #075a3f;
    }

    .blank-input.is-wrong {
      border-color: #c75242;
      background: #ffebe6;
      color: #9b3427;
      animation: nudge 0.25s ease-in-out;
    }

    .peek-btn {
      position: absolute;
      right: 0.25rem;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.1rem;
      line-height: 1;
      opacity: 0.6;
      transition: opacity 0.15s ease;
    }

    .peek-btn:hover {
      opacity: 1;
    }

    .answer-tooltip {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%);
      background: var(--ink);
      color: #fff;
      padding: 0.25rem 0.5rem;
      border-radius: 0.3rem;
      font-size: 0.8rem;
      font-weight: bold;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      z-index: 10;
      display: none;
    }

    .answer-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 4px;
      border-style: solid;
      border-color: var(--ink) transparent transparent transparent;
    }

    .answer-tooltip.is-show {
      display: block;
      animation: reveal 0.2s ease;
    }

    .hidden-view {
      display: none !important;
    }

    /* 한글 해석 */
    .translation-area {
      border-top: 1px solid #e2dbcd;
      padding-top: 1.25rem;
      margin-top: 0.25rem;
    }

    .translation-label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--teal);
    }

    .translation-text {
      display: block;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 2;
      white-space: pre-wrap;
    }

    .translation-loading {
      color: #8a9398;
    }

    .translation-error {
      color: #a74131;
    }

    @keyframes nudge {
      25% {
        transform: translateX(-2px);
      }

      75% {
        transform: translateX(2px);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reveal {
      animation: reveal 0.35s ease both;
    }

    @media (max-width: 640px) {
      .main-content {
        padding: 2rem 1rem 3rem;
      }

      .quiz-copy {
        font-size: 1rem;
        line-height: 2.8;
      }
    }
  </style>
</head>

<body>
  <div class="app-shell">
    <main class="main-content">

      <!-- HEADER -->
      <header class="mb-7 sm:mb-8">
        <div class="mb-3 flex items-center gap-2">
          <span
            class="h-2.5 w-2.5 rounded-full bg-[#df6c51]"
            aria-hidden="true"
          ></span>

          <span
            class="text-xs font-bold tracking-[0.18em] text-[#df6c51]"
          >
            LANGUAGE STUDY
          </span>
        </div>

        <h1 class="text-3xl font-bold leading-tight tracking-tight sm:text-4xl">
          영어·국어 본문 빈칸 문제 생성기 by SEO
        </h1>

        <p class="mt-3 max-w-2xl text-base leading-relaxed text-[#66717a]">
          영어 또는 국어 본문을 입력하고 언어와 난이도를 선택하면
          빈칸 문제지가 생성됩니다! 화이팅팅.
        </p>
      </header>


      <!-- LANGUAGE -->
      <section
        class="paper-panel bg-[#fffcf4] p-5 sm:p-6"
        aria-labelledby="language-title"
      >
        <div class="mb-3">
          <h2 id="language-title" class="text-lg font-bold">
            언어 선택
          </h2>

          <p class="mt-1.5 text-sm text-[#66717a]">
            문제지로 만들 본문의 언어를 선택하세요.
          </p>
        </div>

        <div class="grid grid-cols-2 gap-2">

          <button
            id="language-en"
            class="mode-button is-active rounded-xl bg-[#fffcf4] p-3 text-left border border-[#d9d2c3]"
            type="button"
          >
            <span class="block font-bold">영어</span>
            <span class="mt-0.5 block text-xs">English</span>
          </button>

          <button
            id="language-ko"
            class="mode-button rounded-xl bg-[#fffcf4] p-3 text-left border border-[#d9d2c3]"
            type="button"
          >
            <span class="block font-bold">국어</span>
            <span class="mt-0.5 block text-xs">한국어</span>
          </button>

        </div>
      </section>


      <!-- SOURCE -->
      <section
        class="paper-panel bg-[#fffcf4] p-5 sm:p-6 mt-5"
        aria-labelledby="source-title"
      >
        <div class="mb-4">

          <h2 id="source-title" class="text-lg font-bold">
            1. 영어 본문 입력
          </h2>

          <p
            id="source-help"
            class="mt-1.5 text-sm text-[#66717a]"
          >
            영어 지문을 복사한 다음 아래 상자에 붙여넣어 주세요.
          </p>

        </div>

        <label
          id="source-label"
          for="source-text"
          class="sr-only"
        >
          영어 본문 입력
        </label>

        <textarea
          id="source-text"
          class="source-area w-full rounded-xl border border-[#d9d2c3] bg-white p-4 leading-relaxed"
          placeholder="여기에 영어 본문을 입력하세요..."
          spellcheck="true"
        ></textarea>

        <div
          class="mt-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"
        >

          <p
            id="input-message"
            class="min-h-[1.25rem] text-sm font-medium text-[#a74131]"
            aria-live="polite"
          ></p>

          <button
            id="generate-button"
            class="action-button inline-flex items-center justify-center rounded-xl bg-[#0f766e] px-5 py-3 font-bold text-white shadow-md"
            type="button"
          >
            <span>빈칸 문제 만들기</span>
          </button>

        </div>
      </section>


      <!-- LEVEL -->
      <section
        class="mt-5"
        aria-labelledby="level-title"
      >

        <div class="mb-3 flex items-center justify-between gap-4">

          <h2 id="level-title" class="text-lg font-bold">
            2. 난이도 선택
          </h2>

          <span
            id="level-status"
            class="text-sm font-bold text-[#0f766e]"
            aria-live="polite"
          >
            0단계 선택됨
          </span>

        </div>

        <div class="grid grid-cols-2 gap-2 sm:grid-cols-4">

          <button
            id="level-0"
            class="mode-button is-active rounded-xl bg-[#fffcf4] p-3 text-left border border-[#d9d2c3]"
            type="button"
          >
            <span class="block font-bold">0단계</span>
            <span class="mt-0.5 block text-xs">
              문법/조사 중심
            </span>
          </button>

          <button
            id="level-1"
            class="mode-button rounded-xl bg-[#fffcf4] p-3 text-left border border-[#d9d2c3]"
            type="button"
          >
            <span class="block font-bold">1단계</span>
            <span class="mt-0.5 block text-xs">
              약 30% 빈칸
            </span>
          </button>

          <button
            id="level-2"
            class="mode-button rounded-xl bg-[#fffcf4] p-3 text-left border border-[#d9d2c3]"
            type="button"
          >
            <span class="block font-bold">2단계</span>
            <span class="mt-0.5 block text-xs">
              약 50% 빈칸
            </span>
          </button>

          <button
            id="level-3"
            class="mode-button rounded-xl bg-[#fffcf4] p-3 text-left border border-[#d9d2c3]"
            type="button"
          >
            <span class="block font-bold">3단계</span>
            <span class="mt-0.5 block text-xs">
              약 70% 빈칸
            </span>
          </button>

        </div>
      </section>


      <!-- EMPTY -->
      <section
        id="empty-view"
        class="paper-panel mt-5 bg-[#182530] px-6 py-9 text-center text-white sm:px-10"
      >
        <h2 class="text-xl font-bold">
          위 상자에 본문을 입력하세요
        </h2>
      </section>


      <!-- QUIZ -->
      <section
        id="quiz-view"
        class="hidden-view paper-panel mt-5 bg-[#fffcf4] p-5 sm:p-7"
      >

        <div
          class="flex flex-col gap-3 border-b border-[#e2dbcd] pb-4 sm:flex-row sm:items-start sm:justify-between"
        >

          <div>

            <h2
              id="quiz-title"
              class="text-xl font-bold"
            >
              빈칸 채우기 연습
            </h2>

            <p
              id="quiz-help"
              class="mt-1.5 text-sm text-[#66717a]"
            >
              빈칸에 알맞은 단어를 입력하세요.
              (💡 버튼으로 개별 정답 확인 가능)
            </p>

          </div>

          <div
            id="progress-pill"
            class="shrink-0 rounded-full bg-[#e4f4ef] px-3 py-1.5 text-sm font-bold text-[#0f766e]"
          >
            빈칸 0개
          </div>

        </div>

        <!-- 빈칸 문제 -->
        <div
          id="quiz-content"
          class="quiz-copy py-6"
          aria-live="polite"
        ></div>

        <!-- 영어 한글 해석 -->
        <div
          id="translation-content"
          class="translation-area"
          aria-live="polite"
        ></div>

        <div
          class="flex flex-col-reverse gap-3 border-t border-[#e2dbcd] pt-4 sm:flex-row sm:items-center sm:justify-between"
        >

          <p
            id="result-message"
            class="min-h-[1.5rem] text-sm font-bold text-[#0f766e]"
            aria-live="polite"
          ></p>

          <div class="flex gap-2">

            <button
              id="reset-button"
              class="action-button inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-gray-200 px-4 py-3 font-bold text-gray-700"
              type="button"
            >
              <i
                data-lucide="refresh-cw"
                style="width:16px;height:16px"
                aria-hidden="true"
              ></i>
              <span>다시 풀기</span>
            </button>

            <button
              id="check-button"
              class="action-button inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-[#0f766e] px-4 py-3 font-bold text-white"
              type="button"
            >
              <i
                data-lucide="check-circle-2"
                style="width:17px;height:17px"
                aria-hidden="true"
              ></i>
              <span>전체 정답 확인</span>
            </button>

          </div>
        </div>

      </section>

    </main>
  </div>


  <script>

    /* ==============================
       기본 설정
    ============================== */

    const levelRates = {
      1: 0.3,
      2: 0.5,
      3: 0.7
    };


    /* 영어 문법 후보 */

    const grammarWords = new Set([
      "a", "an", "the",
      "in", "on", "at",
      "by", "for", "from",
      "of", "with", "about",
      "into", "through",
      "during", "before",
      "after", "between",
      "among", "under",
      "over", "above",
      "below", "near",
      "behind", "beside",
      "within", "without",
      "to",

      "who", "whom",
      "whose", "which",
      "that", "where",
      "when", "why",

      "is", "are",
      "was", "were",
      "has", "have",
      "had",
      "does", "do",
      "did"
    ]);


    /* 한국어 조사 */

    const koreanParticles = [
      "은",
      "는",
      "이",
      "가",
      "을",
      "를",
      "에",
      "에서",
      "에게",
      "한테",
      "으로",
      "로",
      "와",
      "과",
      "도",
      "만",
      "까지",
      "부터",
      "보다",
      "처럼",
      "같이",
      "마다",
      "밖에",
      "조차",
      "마저",
      "든지",
      "라도",
      "이나",
      "나",
      "의"
    ];


    let selectedLevel = 0;
    let selectedLanguage = "en";

    let currentAnswers = [];
    let sourceText = "";


    /* ==============================
       DOM
    ============================== */

    const sourceInput =
      document.getElementById("source-text");

    const quizContent =
      document.getElementById("quiz-content");

    const translationContent =
      document.getElementById("translation-content");

    const quizView =
      document.getElementById("quiz-view");

    const emptyView =
      document.getElementById("empty-view");

    const inputMessage =
      document.getElementById("input-message");

    const resultMessage =
      document.getElementById("result-message");

    const progressPill =
      document.getElementById("progress-pill");

    const levelStatus =
      document.getElementById("level-status");

    const sourceTitle =
      document.getElementById("source-title");

    const sourceHelp =
      document.getElementById("source-help");

    const sourceLabel =
      document.getElementById("source-label");


    /* ==============================
       단어 정규화
    ============================== */

    function normalizeWord(value) {

      if (selectedLanguage === "ko") {

        return value
          .replace(/[\s\p{P}\p{S}]/gu, "");

      }

      return value
        .toLowerCase()
        .replace(/[^a-z']/g, "");

    }


    /* ==============================
       토큰 분리
    ============================== */

    function getWordTokens(text) {

      /* 한국어 */

      if (selectedLanguage === "ko") {

        const tokens =
          text.match(/[^\s]+|\s+/gu) || [];

        return tokens.map((value, index) => ({
          value,
          index,

          isWord:
            /[가-힣]/u.test(value)
        }));

      }


      /* 영어 */

      const tokens =
        text.match(
          /[A-Za-z]+(?:'[A-Za-z]+)?|[^A-Za-z]+/g
        ) || [];

      return tokens.map((value, index) => ({
        value,
        index,

        isWord:
          /^[A-Za-z]+(?:'[A-Za-z]+)?$/.test(value)
      }));

    }


    /* ==============================
       랜덤 섞기
    ============================== */

    function shuffle(items) {

      return [...items]
        .sort(() => Math.random() - 0.5);

    }


    /* ==============================
       0단계 후보
    ============================== */

    function isGrammarCandidate(
      token,
      tokens
    ) {

      /* 한국어 */

      if (selectedLanguage === "ko") {

        const word =
          token.value.replace(
            /[^가-힣]/gu,
            ""
          );

        return koreanParticles.some(
          particle =>
            word.endsWith(particle)
        ) || word.length <= 2;

      }


      /* 영어 */

      const word =
        normalizeWord(token.value);

      if (grammarWords.has(word)) {
        return true;
      }

      if (
        word.endsWith("s") &&
        word.length > 2 &&
        !word.endsWith("ss")
      ) {
        return true;
      }

      const previous =
        tokens[token.index - 1];

      if (
        previous &&
        normalizeWord(previous.value) === "to"
      ) {
        return true;
      }

      return false;

    }


    /* ==============================
       빈칸 위치 선택
    ============================== */

    function chooseBlankIndices(
      tokens,
      level
    ) {

      const wordCandidates =
        tokens
          .filter(
            token =>
              token.isWord &&
              normalizeWord(token.value).length > 1
          )
          .map(
            token => token.index
          );


      /* 0단계 */

      if (level === 0) {

        const grammarCandidates =
          tokens
            .filter(
              token =>
                token.isWord &&
                isGrammarCandidate(
                  token,
                  tokens
                )
            )
            .map(
              token => token.index
            );


        const chosen =
          grammarCandidates.length
            ? grammarCandidates
            : shuffle(wordCandidates)
                .slice(
                  0,
                  Math.max(
                    1,
                    Math.min(
                      3,
                      wordCandidates.length
                    )
                  )
                );


        return new Set(chosen);

      }


      /* 1~3단계 */

      const count =
        Math.max(
          1,
          Math.round(
            wordCandidates.length *
            levelRates[level]
          )
        );


      return new Set(
        shuffle(wordCandidates)
          .slice(0, count)
      );

    }


    /* ==============================
       정답 확인
    ============================== */

    function validateInput(
      input,
      shouldNudge
    ) {

      const answer =
        currentAnswers[
          Number(input.dataset.answerIndex)
        ];

      const typedValue =
        normalizeWord(input.value);

      input.classList.remove(
        "is-correct",
        "is-wrong"
      );


      if (!typedValue) {
        return false;
      }


      const isCorrect =
        typedValue === answer.normalized;


      input.classList.add(
        isCorrect
          ? "is-correct"
          : "is-wrong"
      );


      if (
        shouldNudge &&
        !isCorrect
      ) {

        input.classList.remove(
          "is-wrong"
        );

        void input.offsetWidth;

        input.classList.add(
          "is-wrong"
        );

      }


      return isCorrect;

    }


    /* ==============================
       결과 메시지
    ============================== */

    function updateResultMessage() {

      const inputs =
        [
          ...quizContent.querySelectorAll(
            ".blank-input"
          )
        ];


      const correctCount =
        inputs.filter(
          input =>
            validateInput(
              input,
              false
            )
        ).length;


      if (
        correctCount ===
          inputs.length &&
        inputs.length
      ) {

        resultMessage.textContent =
          `완벽해요! ${correctCount}개 빈칸을 모두 맞혔습니다.`;

      } else {

        resultMessage.textContent =
          `${inputs.length}개 중 ${correctCount}개 정답입니다. 빨간 빈칸을 다시 채워 보세요.`;

      }

    }


    /* ==============================
       다음 빈칸
    ============================== */

    function moveToNextBlank(
      currentInput
    ) {

      const inputs =
        [
          ...quizContent.querySelectorAll(
            ".blank-input"
          )
        ];


      const currentIndex =
        inputs.indexOf(currentInput);


      const nextInput =
        inputs[currentIndex + 1];


      if (nextInput) {

        nextInput.focus();
        nextInput.select();

      } else {

        updateResultMessage();

      }

    }


    /* ==============================
       영어 → 한글 해석
    ============================== */

    async function translateEnglishToKorean(text) {

      if (selectedLanguage !== "en") {
        translationContent.innerHTML = "";
        return;
      }


      translationContent.innerHTML = `
        <span class="translation-label">
          KOREAN TRANSLATION
        </span>

        <span class="translation-text translation-loading">
          해석을 불러오는 중...
        </span>
      `;


      try {

        const response =
          await fetch(
            "https://api.mymemory.translated.net/get?langpair=en|ko&q=" +
            encodeURIComponent(text)
          );


        if (!response.ok) {
          throw new Error("번역 요청 실패");
        }


        const data =
          await response.json();


        const translated =
          data?.responseData?.translatedText;


        if (!translated) {
          throw new Error("번역 결과 없음");
        }


        translationContent.innerHTML = `
          <span class="translation-label">
            KOREAN TRANSLATION
          </span>

          <span class="translation-text">
            ${translated}
          </span>
        `;

      } catch (error) {

        translationContent.innerHTML = `
          <span class="translation-label">
            KOREAN TRANSLATION
          </span>

          <span class="translation-text translation-error">
            해석을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.
          </span>
        `;

      }

    }


    /* ==============================
       문제 렌더링
    ============================== */

    function renderQuiz() {

      const tokens =
        getWordTokens(sourceText);


      const blankIndices =
        chooseBlankIndices(
          tokens,
          selectedLevel
        );


      currentAnswers = [];


      const fragment =
        document.createDocumentFragment();


      tokens.forEach(token => {

        /* 빈칸이 아니면 원문 그대로 */

        if (
          !blankIndices.has(
            token.index
          )
        ) {

          fragment.appendChild(
            document.createTextNode(
              token.value
            )
          );

          return;

        }


        const answerIndex =
          currentAnswers.length;


        currentAnswers.push({
          answer: token.value,

          normalized:
            normalizeWord(
              token.value
            )
        });


        /* wrapper */

        const wrapper =
          document.createElement(
            "span"
          );

        wrapper.className =
          "blank-wrapper";


        /* 정답 tooltip */

        const tooltip =
          document.createElement(
            "div"
          );

        tooltip.className =
          "answer-tooltip";

        tooltip.textContent =
          token.value;


        /* input */

        const input =
          document.createElement(
            "input"
          );

        input.type = "text";

        input.className =
          "blank-input";

        input.autocomplete =
          "off";

        input.autocapitalize =
          "off";

        input.spellcheck =
          false;

        input.setAttribute(
          "aria-label",
          `${answerIndex + 1}번째 빈칸`
        );

        input.dataset.answerIndex =
          String(answerIndex);


        const answerLength =
          [...token.value].length;


        input.style.width =
          `${Math.min(
            Math.max(
              answerLength + 2,
              6
            ),
            selectedLanguage === "ko"
              ? 16
              : 13
          )}ch`;


        /* 정답 버튼 */

        const peekBtn =
          document.createElement(
            "button"
          );

        peekBtn.type =
          "button";

        peekBtn.className =
          "peek-btn";

        peekBtn.innerHTML =
          "💡";

        peekBtn.title =
          "정답 확인";


        peekBtn.addEventListener(
          "click",
          e => {

            e.stopPropagation();


            const isShowing =
              tooltip.classList.contains(
                "is-show"
              );


            document
              .querySelectorAll(
                ".answer-tooltip"
              )
              .forEach(
                el =>
                  el.classList.remove(
                    "is-show"
                  )
              );


            if (!isShowing) {

              tooltip.classList.add(
                "is-show"
              );

            }

          }
        );


        /* 입력 */

        input.addEventListener(
          "input",
          () => {

            validateInput(
              input,
              false
            );

            resultMessage.textContent = "";

            tooltip.classList.remove(
              "is-show"
            );

          }
        );


        /* Enter */

        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Enter"
            ) {

              event.preventDefault();

              validateInput(
                input,
                true
              );

              moveToNextBlank(
                input
              );

            }

          }
        );


        wrapper.appendChild(
          tooltip
        );

        wrapper.appendChild(
          input
        );

        wrapper.appendChild(
          peekBtn
        );

        fragment.appendChild(
          wrapper
        );

      });


      quizContent.replaceChildren(
        fragment
      );


      document.getElementById(
        "quiz-title"
      ).textContent =
        selectedLanguage === "ko"
          ? "국어 빈칸 채우기 연습"
          : "영어 빈칸 채우기 연습";


      document.getElementById(
        "quiz-help"
      ).textContent =
        selectedLanguage === "ko"
          ? "빈칸에 알맞은 말이나 어절을 입력하세요. (💡 버튼으로 개별 정답 확인 가능)"
          : "빈칸에 알맞은 단어를 입력하세요. (💡 버튼으로 개별 정답 확인 가능)";


      progressPill.textContent =
        `빈칸 ${currentAnswers.length}개`;


      resultMessage.textContent = "";


      quizView.classList.remove(
        "hidden-view"
      );

      quizView.classList.add(
        "reveal"
      );

      emptyView.classList.add(
        "hidden-view"
      );


      /* 영어일 때 한글 해석 표시 */

      if (selectedLanguage === "en") {

        translateEnglishToKorean(
          sourceText
        );

      } else {

        translationContent.innerHTML = "";

      }


      const firstBlank =
        quizContent.querySelector(
          ".blank-input"
        );


      if (firstBlank) {
        firstBlank.focus();
      }

    }


    /* ==============================
       문제 생성
    ============================== */

    function generateQuiz() {

      const enteredText =
        sourceInput.value.trim();


      const wordCount =
        selectedLanguage === "ko"
          ? (
              enteredText.match(
                /[가-힣]+/gu
              ) || []
            ).length
          : (
              enteredText.match(
                /[A-Za-z]+(?:'[A-Za-z]+)?/g
              ) || []
            ).length;


      if (!enteredText) {

        inputMessage.textContent =
          `${selectedLanguage === "ko"
            ? "국어"
            : "영어"} 본문을 먼저 입력해 주세요.`;

        sourceInput.focus();

        return;

      }


      if (wordCount < 3) {

        inputMessage.textContent =
          `${selectedLanguage === "ko"
            ? "국어 어절"
            : "영어 단어"}를 3개 이상 입력해 주세요.`;

        sourceInput.focus();

        return;

      }


      sourceText =
        enteredText;

      inputMessage.textContent =
        "";


      renderQuiz();

    }


    /* ==============================
       언어 선택
    ============================== */

    function selectLanguage(
      language
    ) {

      selectedLanguage =
        language;


      const enButton =
        document.getElementById(
          "language-en"
        );

      const koButton =
        document.getElementById(
          "language-ko"
        );


      enButton.classList.toggle(
        "is-active",
        language === "en"
      );

      koButton.classList.toggle(
        "is-active",
        language === "ko"
      );


      const isKorean =
        language === "ko";


      sourceTitle.textContent =
        isKorean
          ? "1. 국어 본문 입력"
          : "1. 영어 본문 입력";


      sourceHelp.textContent =
        isKorean
          ? "국어 지문을 복사한 다음 아래 상자에 붙여넣어 주세요."
          : "영어 지문을 복사한 다음 아래 상자에 붙여넣어 주세요.";


      sourceLabel.textContent =
        isKorean
          ? "국어 본문 입력"
          : "영어 본문 입력";


      sourceInput.placeholder =
        isKorean
          ? "여기에 국어 본문을 입력하세요..."
          : "여기에 영어 본문을 입력하세요...";


      sourceInput.spellcheck =
        !isKorean;


      /* 국어 선택 시 해석 영역 제거 */

      if (isKorean) {
        translationContent.innerHTML = "";
      }


      if (sourceText) {
        renderQuiz();
      }

    }


    /* ==============================
       난이도 선택
    ============================== */

    function selectLevel(
      level
    ) {

      selectedLevel =
        level;


      [0, 1, 2, 3].forEach(
        item => {

          const button =
            document.getElementById(
              `level-${item}`
            );


          const isActive =
            item === level;


          button.classList.toggle(
            "is-active",
            isActive
          );

        }
      );


      levelStatus.textContent =
        `${level}단계 선택됨`;


      if (sourceText) {
        renderQuiz();
      }

    }


    /* ==============================
       전체 정답 확인
    ============================== */

    function checkAnswers() {

      const inputs =
        [
          ...quizContent.querySelectorAll(
            ".blank-input"
          )
        ];


      if (!inputs.length) {
        return;
      }


      inputs.forEach(
        input =>
          validateInput(
            input,
            true
          )
      );


      updateResultMessage();


      const firstWrong =
        inputs.find(
          input =>
            !input.classList.contains(
              "is-correct"
            )
        );


      if (firstWrong) {
        firstWrong.focus();
      }

    }


    /* ==============================
       바깥 클릭 → tooltip 닫기
    ============================== */

    document.addEventListener(
      "click",
      e => {

        if (
          !e.target.closest(
            ".blank-wrapper"
          )
        ) {

          document
            .querySelectorAll(
              ".answer-tooltip"
            )
            .forEach(
              el =>
                el.classList.remove(
                  "is-show"
                )
            );

        }

      }
    );


    /* ==============================
       이벤트
    ============================== */

    document
      .getElementById(
        "language-en"
      )
      .addEventListener(
        "click",
        () =>
          selectLanguage("en")
      );


    document
      .getElementById(
        "language-ko"
      )
      .addEventListener(
        "click",
        () =>
          selectLanguage("ko")
      );


    document
      .getElementById(
        "generate-button"
      )
      .addEventListener(
        "click",
        generateQuiz
      );


    document
      .getElementById(
        "check-button"
      )
      .addEventListener(
        "click",
        checkAnswers
      );


    document
      .getElementById(
        "reset-button"
      )
      .addEventListener(
        "click",
        () => {

          if (sourceText) {
            renderQuiz();
          }

        }
      );


    [0, 1, 2, 3].forEach(
      level => {

        document
          .getElementById(
            `level-${level}`
          )
          .addEventListener(
            "click",
            () =>
              selectLevel(level)
          );

      }
    );


    sourceInput.addEventListener(
      "input",
      () => {

        inputMessage.textContent =
          "";

      }
    );


    /* ==============================
       시작
    ============================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        selectLanguage("en");


        if (window.lucide) {
          lucide.createIcons();
        }

      }
    );

  </script>

</body>
